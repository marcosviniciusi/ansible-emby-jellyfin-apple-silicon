all:
  children:
    macmini:
      hosts:
        media01:
          ansible_host: 192.168.251.66
          ansible_user: mgabriel
          # SSH password auth fallback (preferred: install ssh key via `make ssh-key`)
          # Override with: ansible-playbook -e ansible_password=XXX -e ansible_become_password=XXX
          ansible_password: "{{ mac_password | default(lookup('env','MAC_PASSWORD')) }}"
          ansible_become_password: "{{ mac_password | default(lookup('env','MAC_PASSWORD')) }}"
          ansible_become: true
          ansible_become_method: sudo
          ansible_python_interpreter: /usr/bin/python3
