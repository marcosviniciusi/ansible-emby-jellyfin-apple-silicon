---
# mac_base — system-level prep for a fresh Mac Mini.
# All values come from group_vars; templates render the actual file content.

# =============================================================================
#  Toolchain bootstrap (Xcode CLT + Homebrew)
#
#  Runs first because everything below (and the install roles that come
#  after mac_base) depends on /opt/homebrew. Idempotent: skips if CLT and
#  brew are already present.
# =============================================================================

- name: "mac_base | Check Xcode Command Line Tools"
  ansible.builtin.command: /usr/bin/xcode-select -p
  register: clt_check
  failed_when: false
  changed_when: false

- name: "mac_base | Install Xcode Command Line Tools (unattended)"
  # The softwareupdate trick: touch the trigger file that exposes CLT in
  # the update catalog, find the highest-version CLT label, then install
  # it. Takes 5-15 minutes on a fresh Mac.
  ansible.builtin.shell: |
    set -euo pipefail
    TRIGGER=/tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
    /usr/bin/touch "$TRIGGER"
    CLT_LABEL=$(/usr/sbin/softwareupdate -l 2>&1 \
      | /usr/bin/awk -F'Label: ' '/\* Label:.*Command Line Tools/ {print $2}' \
      | /usr/bin/sort -V | /usr/bin/tail -1)
    if [ -z "$CLT_LABEL" ]; then
      echo "ERROR: no Command Line Tools package found in softwareupdate catalog" >&2
      /bin/rm -f "$TRIGGER"
      exit 1
    fi
    /usr/sbin/softwareupdate -i "$CLT_LABEL" --verbose
    /bin/rm -f "$TRIGGER"
  args:
    executable: /bin/bash
  become: true
  when: clt_check.rc != 0
  register: clt_install
  changed_when: clt_install.rc == 0

- name: "mac_base | Verify Xcode CLT installed"
  ansible.builtin.command: /usr/bin/xcode-select -p
  changed_when: false

- name: "mac_base | Check Homebrew at {{ brew_bin }}"
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: brew_check

- name: "mac_base | Pre-create /opt/homebrew owned by {{ brew_install_user }}"
  # Pre-creating with the right ownership lets the brew installer skip its
  # `sudo chown` step, which is the only thing it would prompt for under
  # NONINTERACTIVE=1.
  ansible.builtin.file:
    path: /opt/homebrew
    state: directory
    owner: "{{ brew_install_user }}"
    group: "{{ brew_install_group }}"
    mode: "0755"
  become: true
  when: not brew_check.stat.exists

- name: "mac_base | Install Homebrew (NONINTERACTIVE, as {{ brew_install_user }})"
  ansible.builtin.shell: |
    /bin/bash -c "$(/usr/bin/curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    executable: /bin/bash
    creates: "{{ brew_bin }}"
  become: false
  environment:
    NONINTERACTIVE: "1"
    CI: "1"
    HOMEBREW_NO_ANALYTICS: "1"
    HOMEBREW_NO_AUTO_UPDATE: "1"
  when: not brew_check.stat.exists

- name: "mac_base | Verify Homebrew works"
  ansible.builtin.command: "{{ brew_bin }} --version"
  become: false
  register: brew_version
  changed_when: false

- name: "mac_base | Homebrew version"
  ansible.builtin.debug:
    msg: "{{ brew_version.stdout_lines | first }}"

# =============================================================================
#  System configuration (hostname, users, autofs, keepalive)
# =============================================================================

- name: "mac_base | Set hostname to '{{ mac_hostname }}' (ComputerName + HostName + LocalHostName)"
  ansible.builtin.shell: |
    /usr/sbin/scutil --set ComputerName  "{{ mac_hostname }}"
    /usr/sbin/scutil --set HostName      "{{ mac_hostname }}"
    /usr/sbin/scutil --set LocalHostName "{{ mac_hostname }}"
    /usr/bin/dscacheutil -flushcache
  args:
    executable: /bin/bash
  become: true
  when: mac_hostname | default('') | length > 0
  changed_when: false

- name: "mac_base | Ensure '{{ media_group }}' group exists (gid {{ media_gid }})"
  ansible.builtin.shell: |
    if ! /usr/bin/dscl . -read /Groups/{{ media_group }} >/dev/null 2>&1; then
      /usr/bin/dscl . -create /Groups/{{ media_group }}
      /usr/bin/dscl . -create /Groups/{{ media_group }} PrimaryGroupID {{ media_gid }}
      /usr/bin/dscl . -create /Groups/{{ media_group }} RealName "{{ media_realname }}"
      /usr/bin/dscl . -create /Groups/{{ media_group }} Password "*"
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: "mac_base | Ensure '{{ media_user }}' user exists (uid {{ media_uid }})"
  ansible.builtin.shell: |
    if ! /usr/bin/dscl . -read /Users/{{ media_user }} >/dev/null 2>&1; then
      /usr/bin/dscl . -create /Users/{{ media_user }}
      /usr/bin/dscl . -create /Users/{{ media_user }} UniqueID {{ media_uid }}
      /usr/bin/dscl . -create /Users/{{ media_user }} PrimaryGroupID {{ media_gid }}
      /usr/bin/dscl . -create /Users/{{ media_user }} UserShell /usr/bin/false
      /usr/bin/dscl . -create /Users/{{ media_user }} RealName "{{ media_realname }}"
      /usr/bin/dscl . -create /Users/{{ media_user }} NFSHomeDirectory /var/empty
      /usr/bin/dscl . -create /Users/{{ media_user }} Password "*"
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: "mac_base | Render /etc/synthetic.conf ({{ data_root }} symlink at boot)"
  ansible.builtin.template:
    src: synthetic.conf.j2
    dest: /etc/synthetic.conf
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: synthetic_conf

- name: "mac_base | Ensure /etc/auto_master has /etc/auto_nfs entry"
  ansible.builtin.lineinfile:
    path: /etc/auto_master
    line: "/-\t\t\t/etc/auto_nfs\t\t-nosuid,noowners"
    insertafter: EOF
    state: present
    create: false
  become: true

- name: "mac_base | Render /etc/auto_nfs"
  ansible.builtin.template:
    src: auto_nfs.j2
    dest: /etc/auto_nfs
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: reload automount

- name: "mac_base | Render TCP keepalive LaunchDaemon"
  ansible.builtin.template:
    src: com.local.tcp-keepalive.plist.j2
    dest: "{{ launchd_path }}/com.local.tcp-keepalive.plist"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: bootstrap tcp-keepalive

- name: "mac_base | Apply TCP keepalive sysctls now"
  ansible.builtin.command: /usr/sbin/sysctl -w {{ item }}
  loop:
    - "net.inet.tcp.always_keepalive={{ tcp_always_keepalive }}"
    - "net.inet.tcp.keepidle={{ tcp_keepidle_ms }}"
    - "net.inet.tcp.keepintvl={{ tcp_keepintvl_ms }}"
    - "net.inet.tcp.keepcnt={{ tcp_keepcnt }}"
  become: true
  changed_when: false

- name: "mac_base | Warn if synthetic.conf was just rendered (reboot needed)"
  ansible.builtin.debug:
    msg: >
      /etc/synthetic.conf was created/changed. A REBOOT is required for
      {{ data_root }} to appear as a symlink at root (macOS only re-evaluates
      synthetic.conf at boot). Until you reboot, the Jellyfin/Emby installs
      may fail at {{ data_root }}/* paths.
  when: synthetic_conf is changed

- name: "mac_base | Ensure /var/lib root exists"
  ansible.builtin.file:
    path: /var/lib
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true
