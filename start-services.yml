---
# Mount NFS shares and start Jellyfin + Emby.
#
# Counterpart to stop-services.yml. Run this after the NFS server is back
# online (or after maintenance) to bring the stack back up.
#
# Sequence:
#   1) Reload automount (re-read /etc/auto_nfs)
#   2) Bootstrap Jellyfin + Emby LaunchDaemons
#      (autofs mounts /data/videos and /data/nfs-midia on first access by
#       the daemons themselves — no separate mount step needed)
#   3) Wait for HTTP /System/Info/Public on both — this is the real proof
#      that NFS mounted AND the daemon initialized successfully
#
# Assumes /etc/auto_nfs and the LaunchDaemon plists are already in place
# (i.e. mac_base, jellyfin_install, emby_install have already run).

- name: Mount NFS shares and start Emby + Jellyfin
  hosts: macmini
  gather_facts: false

  tasks:
    - name: "start | Reload automount (-vc)"
      ansible.builtin.command: /usr/sbin/automount -vc
      become: true
      changed_when: false

    # launchctl bootout is async — bootstrap right after can race ("Input/output
    # error", rc=5). Poll until the label is gone, then bootstrap.

    - name: "start | Bootstrap Jellyfin LaunchDaemon"
      ansible.builtin.shell: |
        /bin/launchctl bootout system/{{ jellyfin_launchd_label }} 2>/dev/null || true
        for i in $(seq 1 20); do
          /bin/launchctl print system/{{ jellyfin_launchd_label }} >/dev/null 2>&1 || break
          sleep 0.5
        done
        /bin/launchctl bootstrap system {{ launchd_path }}/{{ jellyfin_launchd_label }}.plist
      args:
        executable: /bin/bash
      become: true
      changed_when: false

    - name: "start | Bootstrap Emby LaunchDaemon"
      ansible.builtin.shell: |
        /bin/launchctl bootout system/{{ emby_launchd_label }} 2>/dev/null || true
        for i in $(seq 1 20); do
          /bin/launchctl print system/{{ emby_launchd_label }} >/dev/null 2>&1 || break
          sleep 0.5
        done
        /bin/launchctl bootstrap system {{ launchd_path }}/{{ emby_launchd_label }}.plist
      args:
        executable: /bin/bash
      become: true
      changed_when: false

    - name: "start | Wait for Jellyfin HTTP /System/Info/Public"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}/System/Info/Public"
        return_content: true
        status_code: 200
      register: jf_check
      retries: "{{ (http_wait_seconds // 5) | int }}"
      delay: 5
      until: jf_check.status == 200

    - name: "start | Wait for Emby HTTP /System/Info/Public"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ emby_port }}/System/Info/Public"
        return_content: true
        status_code: 200
      register: emby_check
      retries: "{{ (http_wait_seconds // 5) | int }}"
      delay: 5
      until: emby_check.status == 200

    - name: "start | Summary"
      ansible.builtin.debug:
        msg:
          - "Jellyfin OK: {{ jf_check.json['ServerName'] | default('?') }} v{{ jf_check.json['Version'] | default('?') }}"
          - "Emby OK:     {{ emby_check.json['ServerName'] | default('?') }} v{{ emby_check.json['Version'] | default('?') }}"
